name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  desktop:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            target: x86_64-unknown-linux-gnu
            artifact: libmpv_stt_plugin.so
          - os: macos-latest
            platform: darwin-arm64
            target: aarch64-apple-darwin
            artifact: libmpv_stt_plugin.dylib
          # Windows is best-effort: ffmpeg's static source build on MSVC is
          # unverified. A failure here is reported without blocking other
          # platforms.
          - os: windows-latest
            platform: windows-x86_64
            target: x86_64-pc-windows-msvc
            artifact: mpv_stt_plugin.dll
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.platform == 'windows-x86_64' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang make nasm pkg-config

      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: brew install nasm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # ffmpeg-sys-next's static source build needs cl.exe on PATH with the
      # MSVC INCLUDE/LIB env; bash steps don't get that by default.
      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # The Build step runs under Git Bash, which prepends its own /usr/bin
      # (coreutils) to PATH on startup — that shadows MSVC's link.exe with
      # Git's link.exe, and rustc fails with "link.exe returned an unexpected
      # error". Point cargo at the real MSVC linker by full path instead.
      - name: Point cargo at the MSVC linker
        if: runner.os == 'Windows'
        shell: bash
        run: |
          vc="${VCToolsInstallDir//\\//}"
          vc="${vc%/}"
          test -f "${vc}/bin/Hostx64/x64/link.exe" || {
            echo "MSVC link.exe not found (VCToolsInstallDir=${VCToolsInstallDir:-unset})" >&2
            exit 1
          }
          echo "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=${vc}/bin/Hostx64/x64/link.exe" >> "$GITHUB_ENV"

      - name: Build (${{ matrix.platform }})
        shell: bash
        run: |
          ./scripts/build-all.sh -p ${{ matrix.platform }} || {
            echo "=== dist/build.log (tail 400) ===";
            tail -n 400 dist/build.log || true;
            echo "=== error-ish lines in dist/build.log ===";
            grep -nE "error|Error|failed|Failed|cannot|not found|panic|✗|Argument list" dist/build.log | tail -n 60 || true;
            if [[ "${{ matrix.platform }}" == "windows-x86_64" ]]; then
              echo "=== toolchain ===";
              which -a cl link 2>/dev/null || true;
              echo "INCLUDE=$INCLUDE";
              echo "LIB=$LIB";
              echo "=== ffmpeg config.log ===";
              find target -name config.log -path '*ffbuild*' -exec sh -c 'echo "--- $1 ---"; tail -n 50 "$1"' _ {} \; || true;
            fi
            exit 1;
          }

      - name: Upload artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}
          path: |
            dist/${{ matrix.platform }}/plugin/${{ matrix.artifact }}
            dist/MANIFEST.txt
            dist/build.log

  android:
    name: android (arm64-v8a)
    runs-on: ubuntu-latest
    env:
      ANDROID_NDK_HOME: ${{ github.workspace }}/target/android-ndk-r29
      NDK: ${{ github.workspace }}/target/android-ndk-r29
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang make nasm pkg-config cmake meson ninja-build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Download Android NDK r29
        run: |
          mkdir -p "${{ github.workspace }}/target"
          curl -fsSL -o /tmp/android-ndk.zip \
            https://dl.google.com/android/repository/android-ndk-r29-linux.zip
          # The zip's top-level directory IS android-ndk-r29, which already
          # matches $ANDROID_NDK_HOME — extracting there needs no move.
          unzip -q /tmp/android-ndk.zip -d "${{ github.workspace }}/target"
          test -d "$ANDROID_NDK_HOME/toolchains" \
            && test -f "$ANDROID_NDK_HOME/source.properties" \
            || { echo "NDK not laid out as expected at $ANDROID_NDK_HOME"; exit 1; }

      - name: Build (android)
        run: |
          # Run in a minimal environment: android-mpv's cross-build piles up
          # environment variables, which blows past exec's ARG_MAX and makes
          # every later command (date/uname/cargo) fail with "Argument list
          # too long". env -i keeps this job's env small; the NDK/toolchain
          # vars are re-exported by build-all.sh itself.
          env -i \
            PATH="$PATH" HOME="$HOME" \
            CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}" \
            RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}" \
            ANDROID_NDK_HOME="$ANDROID_NDK_HOME" NDK="$NDK" TERM=xterm \
            ./scripts/build-all.sh -p android -a arm64-v8a || {
            echo "=== dist/build.log (tail 400) ===";
            tail -n 400 dist/build.log || true;
            echo "=== error-ish lines in dist/build.log ===";
            grep -nE "error|Error|failed|Failed|cannot|not found|panic|✗|Argument list" dist/build.log | tail -n 60 || true;
            exit 1;
          }

      - name: Upload artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: dist-android
          path: |
            dist/android/**/plugin/*.so
            dist/MANIFEST.txt
            dist/build.log
