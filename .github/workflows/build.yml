name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  desktop:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            target: x86_64-unknown-linux-gnu
            artifact: libmpv_stt_plugin.so
          - os: macos-latest
            platform: darwin-arm64
            target: aarch64-apple-darwin
            artifact: libmpv_stt_plugin.dylib
          - os: windows-latest
            platform: windows-x86_64
            target: x86_64-pc-windows-msvc
            artifact: mpv_stt_plugin.dll
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang make pkg-config

      # macOS links dynamically against brew FFmpeg (no source compile); the
      # plugin's runtime deps are the brew dylibs themselves.
      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # bash steps don't get the MSVC INCLUDE/LIB env by default. FFmpeg itself
      # is not compiled here — build-all.sh downloads a prebuilt win64 shared
      # package and links it dynamically — so this is the only Windows setup.
      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build (${{ matrix.platform }})
        shell: bash
        run: |
          ./scripts/build-all.sh -p ${{ matrix.platform }} || {
            echo "=== dist/build.log (tail 400) ===";
            tail -n 400 dist/build.log || true;
            echo "=== error-ish lines in dist/build.log ===";
            grep -nE "error|Error|failed|Failed|cannot|not found|panic|✗" dist/build.log | tail -n 60 || true;
            exit 1;
          }

      - name: Upload artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}
          path: |
            dist/${{ matrix.platform }}/plugin/${{ matrix.artifact }}
            dist/${{ matrix.platform }}/runtime/
            dist/MANIFEST.txt
            dist/build.log

  android:
    name: android (arm64-v8a)
    runs-on: ubuntu-latest
    env:
      ANDROID_NDK_HOME: ${{ github.workspace }}/target/android-ndk-r29
      NDK: ${{ github.workspace }}/target/android-ndk-r29
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang make nasm pkg-config cmake meson ninja-build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Download Android NDK r29
        run: |
          mkdir -p "${{ github.workspace }}/target"
          curl -fsSL -o /tmp/android-ndk.zip \
            https://dl.google.com/android/repository/android-ndk-r29-linux.zip
          # The zip's top-level directory IS android-ndk-r29, which already
          # matches $ANDROID_NDK_HOME — extracting there needs no move.
          unzip -q /tmp/android-ndk.zip -d "${{ github.workspace }}/target"
          test -d "$ANDROID_NDK_HOME/toolchains" \
            && test -f "$ANDROID_NDK_HOME/source.properties" \
            || { echo "NDK not laid out as expected at $ANDROID_NDK_HOME"; exit 1; }

      - name: Build (android)
        run: |
          # Run in a minimal environment: android-mpv's cross-build piles up
          # environment variables, which blows past exec's ARG_MAX and makes
          # every later command (date/uname/cargo) fail with "Argument list
          # too long". env -i keeps this job's env small; the NDK/toolchain
          # vars are re-exported by build-all.sh itself.
          env -i \
            PATH="$PATH" HOME="$HOME" \
            CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}" \
            RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}" \
            ANDROID_NDK_HOME="$ANDROID_NDK_HOME" NDK="$NDK" TERM=xterm \
            ./scripts/build-all.sh -p android -a arm64-v8a || {
            echo "=== dist/build.log (tail 400) ===";
            tail -n 400 dist/build.log || true;
            echo "=== error-ish lines in dist/build.log ===";
            grep -nE "error|Error|failed|Failed|cannot|not found|panic|✗|Argument list" dist/build.log | tail -n 60 || true;
            exit 1;
          }

      - name: Upload artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: dist-android
          path: |
            dist/android/**/plugin/*.so
            dist/MANIFEST.txt
            dist/build.log
